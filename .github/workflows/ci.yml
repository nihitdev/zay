name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Zig 0.16.0
        uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0

      - name: Install libalpm headers and library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libalpm-dev

      - name: Run maintainer checks
        run: scripts/check.sh
